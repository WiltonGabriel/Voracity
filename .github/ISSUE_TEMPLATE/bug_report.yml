name: Reportar Bug
description: Relate um erro de simulação, renderização Vulkan, interface ou carregamento de mods.
title: "[Bug]: "
labels: [ "bug", "alpha" ]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar o **Voracity** em fase de concepção / Alpha! Preencha os detalhes abaixo para podermos reproduzir com precisão.
  - type: dropdown
    id: area
    attributes:
      label: Área Afetada
      options:
        - Simulação / Economia / Política (Voracity.Core)
        - Mapa / Shader Vulkan / Províncias (Voracity.Client)
        - HUD / Menus / Localização / Save-Load
        - Carregamento de Dados ou Mods JSON (data/)
        - CLI / Testes Automatizados
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      description: O que aconteceu versus o que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para Reproduzir
      placeholder: |
        1. Iniciar campanha com AET
        2. Clicar na província X / abrir aba Y
        3. Observar erro ou comportamento inesperado...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sistema Operacional, .NET SDK e GPU (se aplicável)
      placeholder: "Ex.: Linux / .NET 10.0 / Godot 4.7.2 Mono / AMD RX 6600 Vulkan"
  - type: textarea
    id: mods
    attributes:
      label: Mods Ativos / Logs
      description: Informe se há algum mod habilitado em data/mods/ e cole mensagens de erro relevantes.
