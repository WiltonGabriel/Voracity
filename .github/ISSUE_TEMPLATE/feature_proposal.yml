name: Sugestão ou Proposta (Alpha)
description: Proponha uma mecânica, melhoria de mapa/UI ou recurso de modding para o Voracity.
title: "[Proposta]: "
labels: [ "enhancement", "alpha" ]
body:
  - type: dropdown
    id: category
    attributes:
      label: Categoria
      options:
        - Mecânica de Grand Strategy / Economia / Dinastia
        - Mapa Cartográfico / Visual / UX
        - Esquema de Modding & Conteúdo de Pontária
        - Performance & Ferramentas de Desenvolvimento
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problema ou Oportunidade
      description: Por que essa melhoria deixa a simulação ou a experiência de jogo mais profunda ou clara?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução Proposta
      description: Descreva o comportamento esperado e como ele respeita a separação Core <-> Client (ou schema JSON em data/).
    validations:
      required: true
