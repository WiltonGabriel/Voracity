name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Tests & Headless Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8.0 & 10.0 SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate base JSON catalogs
        shell: python
        run: |
          import json, pathlib
          files = sorted(pathlib.Path("data/base").rglob("*.json"))
          assert files, "No JSON catalogs found under data/base/"
          for f in files:
              json.loads(f.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} JSON catalogs successfully.")

      - name: Restore & Build solution
        run: dotnet build Voracity.slnx --configuration Release --nologo

      - name: Run xUnit tests
        run: dotnet test src/Voracity.Tests/Voracity.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Headless 360-day CLI smoke simulation
        run: dotnet run --project src/Voracity.Cli/Voracity.Cli.csproj --configuration Release --no-build -- --nation AET --days 360
